version: "2"

# e2e/ is entirely behind `//go:build e2e` (except doc.go and guard_test.go)
# so the tagged files exist for the linter at all - without this, golangci-lint
# never sees them and a lint-only issue in e2e/ would pass CI silently.
run:
  build-tags: [e2e]

# Default linter set (errcheck, govet, ineffassign, staticcheck, unused) - see
# AGENTS.md's "Developing oak-dev itself" section for why: go vet/gofmt/tests
# were the only gate before this file existed, and this keeps that bar rather
# than raising it with an opinionated preset.
linters:
  settings:
    errcheck:
      exclude-functions:
        # Unchecked writes to a writer this package already owns (stdout, or a
        # caller-supplied io.Writer used purely for progress output) - checking
        # these adds noise without adding safety.
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
