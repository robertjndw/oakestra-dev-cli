# `oak-dev debug root_service_manager` layers this on top of
# override-live-root_service_manager.yml. Unlike the other Python debug
# overlays, this one still has to install gunicorn itself - it replaces
# `command:` wholesale, so the live override's own `pip install gunicorn`
# doesn't run. debugpy is installed separately by `oak-dev debug` via
# `compose exec` (see cmd/oak-dev/cmd_debug.go), same as every other
# component. Single worker, no --reload: both fork extra processes debugpy
# would not follow into.
services:
  root_service_manager:
    command: >
      sh -c "pip install --quiet --disable-pip-version-check gunicorn &&
      exec python -m debugpy --listen 0.0.0.0:5999 -m gunicorn -k eventlet
      --workers 1 --bind [::]:10099 oak_root_sm:app"
    ports:
      - "5683:5999"
