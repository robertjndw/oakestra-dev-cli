# Phase 1f: `oak-dev debug system_manager` layers this on top of
# override-live-system_manager.yml. debugpy is pip-installed on the fly (not in
# requirements.txt) since this is opt-in tooling, not a production dependency.
#
# The install has to happen in `command:`, at container start, not once via
# `docker compose exec` beforehand: applying this overlay force-recreates the
# container, which throws away the writable layer the install landed in - so an
# up-front install would be gone by the time this command ran. Same approach as
# the service managers' `pip install gunicorn`.
#
# Single worker, no --reload: both fork extra processes debugpy would not
# follow into.
services:
  system_manager:
    command: >
      sh -c "pip install --quiet --disable-pip-version-check debugpy &&
      exec python -m debugpy --listen 0.0.0.0:5999 -m gunicorn --workers 1
      --bind [::]:10000 system_manager:app"
    ports:
      - "5678:5999"
