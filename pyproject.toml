[tool.ruff]
line-length = 100
# tests/conftest.py does a bare `from helpers import ...` that only resolves
# because pytest inserts tests/ on sys.path (no tests/__init__.py). Without
# this, ruff run from the repo root flags it as unresolved.
src = ["tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "BLE", # blind except
]
