name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go build / vet / gofmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # -run '^$' compiles and links the tagged e2e binary without running
      # anything or needing a stack - it's the CI-side guarantee that a type
      # error in e2e/ can't silently survive because nothing ever compiles
      # it under the default (no -tags e2e) build.
      - name: e2e suite compiles
        run: go test -tags e2e -run '^$' ./e2e/...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      # internal/watch and internal/multilog are concurrent - always race-test.
      - run: go test ./... -race

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
