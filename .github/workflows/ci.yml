name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go build / vet / gofmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      # internal/watch and internal/multilog are concurrent - always race-test.
      - run: go test ./... -race

  lint:
    name: golangci-lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # setup-uv has no "v9" moving major tag (its last one is v7); pin the
      # exact release instead.
      - uses: astral-sh/setup-uv@v9.0.0

      - run: uvx ruff check tests/

      - run: uvx ruff format --check tests/

  e2e-smoke:
    name: e2e smoke (health + registration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout oakestra-macos-testing
        uses: actions/checkout@v7
        with:
          path: oakestra-macos-testing
          # Makefile's VERSION uses `git describe --tags` - a shallow checkout
          # would stamp a bare SHA instead.
          fetch-depth: 0

      - name: checkout oakestra (develop)
        uses: actions/checkout@v7
        with:
          repository: oakestra/oakestra
          ref: develop
          path: oakestra

      - uses: actions/setup-go@v7
        with:
          go-version-file: oakestra-macos-testing/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: build oak-dev
        working-directory: oakestra-macos-testing
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/oak-dev" ./cmd/oak-dev
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: configure
        working-directory: oakestra-macos-testing
        run: |
          cp .env.example .env
          cp oak-dev.yaml.example oak-dev.yaml

      - name: doctor --fix
        working-directory: oakestra-macos-testing
        run: oak-dev doctor --fix

      - name: up
        working-directory: oakestra-macos-testing
        run: oak-dev up

      - name: test --smoke
        working-directory: oakestra-macos-testing
        env:
          # Hosted runners are slower than a local dev machine, and
          # wait_until() burns the full timeout before failing - the 180s/300s
          # defaults are a likely false red here. These are process env vars,
          # not .env entries: config.loadDotEnv() never exports .env into the
          # environment, so pytest would never see them there.
          OAK_READY_TIMEOUT: "600"
          OAK_DEPLOY_TIMEOUT: "600"
        run: oak-dev test --smoke --no-up

      - name: diagnostics
        if: failure()
        working-directory: oakestra-macos-testing
        run: |
          mkdir -p /tmp/oak-dev-diagnostics
          oak-dev status > /tmp/oak-dev-diagnostics/status.txt 2>&1 || true
          # `oak-dev logs` with no target streams forever (Follow: true,
          # hardcoded) - --no-follow only takes effect once at least one
          # target is named, so pass the three stacks explicitly or this step
          # hangs until the job timeout and the artifact never uploads.
          oak-dev logs root cluster worker --no-follow > /tmp/oak-dev-diagnostics/logs.txt 2>&1 || true
          docker ps -a > /tmp/oak-dev-diagnostics/docker-ps.txt 2>&1 || true

      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-diagnostics
          path: /tmp/oak-dev-diagnostics
          retention-days: 7
